name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_BUILD_DIR: target
  RUSTFLAGS: -D warnings

jobs:
  macos:
    name: macOS ${{ matrix.arch }} unsigned
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Checkout Codey
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: JavaScript tests
        run: pnpm run test:js

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build unsigned macOS app
        env:
          CODEY_SKIP_CODESIGN: "1"
        run: pnpm run build

      - name: Verify and archive macOS app
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APP="target/release/bundle/macos/Codey.app"
          test -x "$APP/Contents/MacOS/codey"
          test -x "$APP/Contents/MacOS/codey-fastctx"
          test -f "$APP/Contents/Resources/Codey.icns"
          test -f "$APP/Contents/Resources/README.md"
          test -f "$APP/Contents/Resources/LICENSE"
          test -f "$APP/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -f "$APP/Contents/Resources/licenses/FastCtx/LICENSE-APACHE"
          test -f "$APP/Contents/Resources/licenses/FastCtx/NOTICE"
          plutil -lint "$APP/Contents/Info.plist"
          if codesign --verify "$APP" >/dev/null 2>&1; then
            echo "Expected an unsigned macOS bundle, but codesign verification succeeded." >&2
            exit 1
          fi

          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION="${VERSION#V}"
          else
            VERSION="${VERSION}-${GITHUB_RUN_NUMBER}"
          fi
          VERSION="${VERSION//\//-}"

          mkdir -p dist/macos
          ARCHIVE="dist/macos/Codey-${VERSION}-macos-${{ matrix.arch }}-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: codey-macos-${{ matrix.arch }}-unsigned
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

    steps:
      - name: Checkout Codey
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install NSIS
        shell: pwsh
        run: |
          $maxAttempts = 3
          $installExitCode = 1
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            choco install nsis --yes --no-progress
            $installExitCode = $LASTEXITCODE
            if ($installExitCode -eq 0) {
              break
            }

            if ($attempt -lt $maxAttempts) {
              $delaySeconds = 15 * $attempt
              Write-Warning "Chocolatey failed to install NSIS (attempt $attempt/$maxAttempts, exit code $installExitCode). Retrying in $delaySeconds seconds."
              Start-Sleep -Seconds $delaySeconds
            }
          }
          if ($installExitCode -ne 0) {
            throw "Chocolatey failed to install NSIS after $maxAttempts attempts (exit code $installExitCode)."
          }

          $makensis = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\Bin\makensis.exe",
            "${env:ProgramFiles}\NSIS\Bin\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $command = Get-Command makensis -ErrorAction SilentlyContinue
            if ($command) {
              $makensis = $command.Source
            }
          }
          if (-not $makensis) {
            throw "makensis.exe was not found after installing NSIS"
          }
          Split-Path $makensis | Out-File -FilePath $env:GITHUB_PATH -Append
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: JavaScript tests
        run: pnpm run test:js

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Windows executable
        run: pnpm run build

      - name: Build Windows packages
        id: package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v", "V")
          } else {
            $version = "$version-$env:GITHUB_RUN_NUMBER"
          }
          $version = $version -replace '[\\/]', '-'

          New-Item -ItemType Directory -Force "dist\windows" | Out-Null

          $makensis = $env:MAKENSIS
          if (-not $makensis -or -not (Test-Path $makensis)) {
            $makensis = @(
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "${env:ProgramFiles}\NSIS\makensis.exe",
              "${env:ProgramFiles(x86)}\NSIS\Bin\makensis.exe",
              "${env:ProgramFiles}\NSIS\Bin\makensis.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) {
            $command = Get-Command makensis -ErrorAction SilentlyContinue
            if ($command) {
              $makensis = $command.Source
            }
          }
          if (-not $makensis) {
            throw "makensis.exe was not found. The NSIS install step must expose it before packaging."
          }
          $installerScript = (Resolve-Path "scripts\installer\windows\Codey.nsi").Path
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" "/DPROJECT_ROOT=$env:GITHUB_WORKSPACE" $installerScript
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $installer = "dist\windows\Codey-$version-windows-x64-setup.exe"
          if (-not (Test-Path $installer)) {
            throw "NSIS installer was not created: $installer"
          }
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: codey-windows-x64-installer
          path: ${{ steps.package.outputs.installer }}
          if-no-files-found: error

  publish:
    name: Attach packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos
      - windows
    runs-on: macos-14

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: codey-*
          path: release-assets
          merge-multiple: true

      - name: Verify the release version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION#V}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$PACKAGE_VERSION" = "$TAG_VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION." >&2
            exit 1
          }

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

